# ============================================================
# Evaluation configuration — Phase 5 (RAGAS + IR metrics)
# ============================================================

# Golden labelled set used by both retrieval metrics and RAGAS.
# Schema: see data/evaluation/golden_qa_schema.md
golden_set:
  path: "data/evaluation/golden_qa.jsonl"

# ============================================================
# Retrieval metrics (Recall@K, MRR, Precision@K)
# ============================================================
retrieval_metrics:
  # K values to report. (Recall@K plateaus quickly — these are the standard cuts.)
  k_values: [1, 3, 5, 10]
  # Where the retrieval pool comes from for the "Phase 2 only" baseline.
  hybrid_top_k_for_baseline: 10
  # The pool size we feed into the cross-encoder for the "Phase 3" arm.
  hybrid_top_k_for_rerank: 10
  # Final K after re-ranking — should match configs/retrieval.yaml `final_top_k`.
  rerank_final_k: 3

  # Where to dump the per-query CSV (one row per query × stage).
  output_csv: "data/evaluation/results/retrieval_metrics.csv"

# ============================================================
# RAGAS — LLM-as-a-judge metrics
# ============================================================
ragas:
  # Which metrics to compute. Disable individually if budget-constrained.
  metrics:
    faithfulness: true
    answer_relevancy: true
    context_precision: true
    context_recall: true

  # Judge LLM. RAGAS needs an LLM + an embeddings model to evaluate
  # another LLM. Keep this cheap (the judge is called many times per question).
  #   backend ∈ { "openai" | "ollama" | "hf" }
  judge:
    backend: "openai"
    openai:
      model: "gpt-4o-mini"
      api_key_env: "OPENAI_API_KEY"
      base_url: "https://api.openai.com/v1"
      embeddings_model: "text-embedding-3-small"
    ollama:
      base_url: "http://localhost:11434"
      model: "qwen2:7b-instruct"
      # RAGAS needs embeddings too — a fast SBERT model on local CPU is fine.
      embeddings_model_hf: "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"
    hf:
      # On-device judge — only useful with a 24 GB+ GPU.
      model_name: "Qwen/Qwen2-7B-Instruct"
      embeddings_model_hf: "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"

  # Output CSV with per-question RAGAS scores.
  output_csv: "data/evaluation/results/ragas_scores.csv"
  # If true, run the full RAG pipeline for each question to produce (answer, contexts).
  # If false, the golden_set must already contain `answer` and `contexts` fields.
  run_pipeline_live: true
