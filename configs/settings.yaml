# ============================================================
# Traffic Law Assistant — global configuration
# ============================================================

paths:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  chunks_file: "data/processed/chunks.jsonl"
  tables_file: "data/processed/tables.jsonl"
  vector_store: "vector_store/chroma"
  bm25_index: "vector_store/bm25_index.pkl"
  log_dir: "logs"

documents: {}

csv_sources:
  metadata:
    file: "metadata.csv"
    title: "Consolidated Vietnamese Traffic Law Dataset"
    short: "CONSOLIDATED"
    year: 2026
    issued_by: "Mixed"
    description: "Consolidated dataset of all traffic laws, decrees, circulars and standards."

# Chunking strategy
chunking:
  # granularity: one of "dieu", "khoan", "diem"
  # khoan = one chunk per Khoản (recommended for traffic-law QA)
  granularity: "khoan"
  # If a Khoản exceeds this many characters, split further by Điểm.
  max_chunk_chars: 1800
  # If a Điều has no Khoản (rare — purely declarative articles), emit it as a single chunk.
  emit_dieu_when_no_khoan: true
  # Whether to keep Chương / Mục headings as their own (informational) chunks.
  emit_structural_headings: false

# Vietnamese tokenization for BM25 (overridden in configs/retrieval.yaml for Phase 2)
tokenizer:
  backend: "pyvi"           # pyvi | vncorenlp
  lowercase: true
  remove_punctuation: true

# Logging
logging:
  level: "INFO"
  rotation: "10 MB"
